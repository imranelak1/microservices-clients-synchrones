server:
  port: ${SERVER_PORT:8081}
  tomcat:
    threads:
      max: 300
    accept-count: 1000
spring:
  application:
    name: SERVICE-CLIENT
  profiles:
    active: ${DISCOVERY:eureka}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    root: WARN
